[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellscientist"
version = "1.0.0"
description = "Protocol-constrained CellScientist refinement for BBBC036 and BBBC047"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "h5py>=3.8",
  "joblib>=1.3",
  "torch>=2.1",
]

[tool.setuptools]
packages = ["cellscientist"]
